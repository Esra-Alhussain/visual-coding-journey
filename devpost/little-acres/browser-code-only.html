<aside class="code-panel"><div class="single-guide" aria-live="polite"><small data-i18n="step"></small><h2 id="guideTitle"></h2><p id="guideNote"></p><code id="nextCommand" dir="ltr"></code><div class="command-meaning" id="commandMeaning"></div></div><label class="code-label" for="code" data-i18n="codeTitle"></label><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" dir="ltr" aria-describedby="guideNote">move_right(1)</textarea><div class="code-actions"><button id="run" class="primary" data-i18n="run"></button><button id="stop" disabled data-i18n="stop"></button></div><div id="execution" class="execution" aria-live="polite"></div><div id="feedback" class="feedback" role="status"></div><details class="learning-help"><summary data-i18n="help"></summary><p data-i18n="helpNote"></p><dl><dt dir="ltr">move_right(1) ↘</dt><dd data-i18n="right"></dd><dt dir="ltr">move_left(1) ↖</dt><dd data-i18n="left"></dd><dt dir="ltr">move_up(1) ↗</dt><dd data-i18n="up"></dd><dt dir="ltr">move_down(1) ↙</dt><dd data-i18n="down"></dd><dt dir="ltr">farm.plant(1, "carrot")</dt><dd data-i18n="plantMeaning"></dd><dt dir="ltr">farm.water(1)</dt><dd data-i18n="waterMeaning"></dd><dt dir="ltr">farm.harvest(1)</dt><dd data-i18n="harvestMeaning"></dd></dl></details><div class="panel-bottom"><button id="reset" data-i18n="reset"></button><button id="sound" data-i18n="soundOff"></button></div><details class="learning-help about"><summary data-i18n="details"></summary><label class="pace"><span data-i18n="pace"></span><input id="pace" type="range" min="120" max="500" value="250"></label><p data-i18n="fineprint"></p></details></aside></main><script src="engine.js"></script><script src="i18n.js"></script><script src="app.js"></script><script>
(async()=>{const results=[],delay=ms=>new Promise(r=>setTimeout(r,ms)),check=(v,label)=>{if(!v)throw Error(label);results.push(label);},click=selector=>{const n=document.querySelector(selector);if(!n)throw Error('Missing '+selector);n.dispatchEvent(new MouseEvent('click',{bubbles:true}));},idle=()=>FarmGame.whenIdle(),code=async value=>{document.getElementById('code').value=value;click('#run');await idle();},snap=()=>JSON.stringify(FarmGame.snapshot());
function routeCode(route){let previous=FarmGame.snapshot().actor,parts=[];for(const p of route){const name=p.x>previous.x?'move_right':p.x<previous.x?'move_left':p.y<previous.y?'move_up':'move_down';if(parts.at(-1)?.name===name)parts.at(-1).steps++;else parts.push({name,steps:1});previous=p;}return parts.map(c=>c.name+'('+c.steps+')').join('\n');}
async function reachPlot(id){const route=FarmEngine.pathToPlot(FarmGame.snapshot(),id);if(route?.length)await code(routeCode(route));}
async function grow(id){await reachPlot(id);await code('farm.plant('+id+', "carrot")\nfarm.water('+id+')');await delay(6200);await code('farm.harvest('+id+')');}
try{
document.getElementById('pace').value='120';check(document.documentElement.lang==='ar'&&document.documentElement.dir==='rtl','Arabic and RTL by default');check(document.getElementById('code').dir==='ltr','Python editor remains LTR');
const initial=snap(),initialCode=document.getElementById('code').value;click('[data-tile="1,5"]');check(snap()===initial,'ground click cannot move or mutate');check(/[\u0600-\u06ff]/.test(document.getElementById('guideNote').textContent),'ground click gives Arabic instruction');click('#plot-1');click('#plot-2');check(snap()===initial,'crop clicks cannot plant or move');check(document.getElementById('code').value===initialCode,'inspection never writes learner code');check(document.getElementById('routeGuide').children.length>0,'numbered route is visible');
click('#language');check(document.documentElement.lang==='en'&&document.documentElement.dir==='ltr','English switch works');check(snap()===initial&&document.getElementById('code').value===initialCode,'language switch preserves code and game state');click('#language');check(document.getElementById('run').textContent==='شغّل الكود','Arabic controls restored');check(document.getElementById('routeGuide').children.length>0,'language switch preserves visible numbered route');
await code('farm.plant(1, "carrot")');check(snap()===initial,'remote farm command cannot auto-walk');check(/[\u0600-\u06ff]/.test(document.getElementById('feedback').textContent),'proximity error is Arabic');
await code('farm.water(99)');check(snap()===initial&&/[\u0600-\u06ff]/.test(document.getElementById('feedback').textContent),'syntax error is Arabic and preserves state');
click('#plot-1');await code('move_right(1)');check(FarmGame.snapshot().actor.x===1&&FarmGame.snapshot().actor.y===5,'only Run code moves Mochi');check(document.getElementById('nextCommand').textContent==='move_up(3)','guide advances to next movement');await code('move_up(3)\nfarm.plant(1, "carrot")');check(FarmGame.snapshot().plots[0].crop==='carrot','explicit approach permits code planting');const planted=snap();click('#plot-1');check(snap()===planted&&FarmGame.snapshot().plots[0].wateredAt===null,'planted crop inspection cannot water');await code('farm.water(1)');await delay(6200);const ready=snap();click('#plot-1');check(snap()===ready&&FarmGame.snapshot().harvested===0,'ready crop inspection cannot harvest');await code('farm.harvest(1)');check(FarmGame.snapshot().harvested===1,'code harvest works');await grow(2);check(FarmGame.snapshot().complete,'meadow mission completes using code only');
click('#reset');document.getElementById('code').value='move_right(1)\nmove_up(3)\nfarm.plant(1, "carrot")';click('#run');click('#stop');await idle();check(!FarmGame.snapshot().plots[0].crop,'Stop cancels later crop action');
click('[data-option="river"]');const riverStart=snap();click('#bridgeVisual');check(snap()===riverStart,'bridge inspection cannot repair or move');await grow(1);await code(routeCode(FarmEngine.path(FarmGame.snapshot(),{x:4,y:4})));await code('farm.repair_bridge()');check(FarmGame.snapshot().complete&&FarmGame.snapshot().bridge,'river mission uses explicit travel and repair code');
click('[data-option="cafe"]');await grow(1);await grow(2);await code('farm.deliver()');check(!FarmGame.snapshot().delivered,'delivery cannot auto-walk');await code(routeCode(FarmEngine.path(FarmGame.snapshot(),{x:6,y:3})));await code('farm.deliver()');check(FarmGame.snapshot().complete&&FarmGame.snapshot().delivered,'cafe mission uses explicit travel and delivery code');
click('[data-option="meadow"]');click('#reset');click('#plot-1');check(FarmGame.snapshot().moves===0,'reset returns to waiting state');check(document.body.scrollWidth<=innerWidth,'no horizontal overflow');check(!document.querySelector('[data-tool]'),'direct action toolbar removed');const hero=document.getElementById('farmer').getBoundingClientRect(),scene=document.querySelector('.game').getBoundingClientRect();check(hero.left>=scene.left&&hero.right<=scene.right,'Mochi stays visible in RTL layout');
const report=document.createElement('pre');report.id='code-only-result';report.hidden=true;report.textContent=JSON.stringify({ok:true,results,viewport:innerWidth,bodyWidth:document.body.scrollWidth,state:FarmGame.snapshot()});document.body.append(report);
}catch(e){const p=document.createElement('pre');p.id='code-only-result';p.textContent=JSON.stringify({ok:false,error:e.message,results,state:window.FarmGame?.snapshot()});document.body.prepend(p);console.error(e);}})();
</script></body></html>
