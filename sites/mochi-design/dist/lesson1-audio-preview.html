<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Lesson 1 audio review</title><style>body{font:16px system-ui;background:#f5f1e9;color:#253c3c;max-width:900px;margin:30px auto;padding:20px}article{background:white;border-radius:16px;padding:18px;margin:16px 0}button,input{margin:6px;padding:8px}label{display:inline-block}small{display:block;color:#536666}button{cursor:pointer}#status{position:sticky;top:0;background:#def3ed;padding:12px}</style><h1>Mochi · Lesson 1 audio review</h1><p>Six uploaded voices available. Effects are not downloaded. Choose an effect file per row to hear it mixed with your voice. Row 5 reuses row 2’s effect. This preview does not change the game.</p><p>Effect volume <input id="volume" type="range" min="0" max="1" step=".05" value=".3"><button id="stop">Stop</button></p><p id="status" role="status">Ready. Timing is adjustable; listen before approving.</p><main id="rows"></main><script>const rows=[{"line":"Hi! I’m Mochi. Let’s build something wonderful together!","voice":"Hi sound.mp3","effect":"Explainer video pops whoosh light pop","url":"https://mixkit.co/free-sound-effects/whoosh/","action":"Appear and wave","delay":0,"voiceDelay":0.7},{"line":"You can call me Mochi—or give me a name you like!","voice":"01_name_choice.wav","effect":"Bubble pop up alert notification","url":"https://mixkit.co/free-sound-effects/pop/","action":"Head tilt; show choices","delay":0},{"line":"Let’s try it together. Put my new name between the quotes.","voice":"02_rename_prompt.wav","effect":"Select click","url":"https://mixkit.co/free-sound-effects/click/","action":"Gesture toward highlighted quotes","delay":0},{"line":"I love it! Look—you just changed something with code!","voice":"03_rename_success.wav","effect":"Quick win video game notification","url":"https://mixkit.co/free-sound-effects/click/","action":"Happy bounce","delay":0,"voiceDelay":0.6},{"line":"Want a little hint?","voice":"04_offer_hint.wav","effect":"Bubble pop up alert notification","url":"https://mixkit.co/free-sound-effects/pop/","action":"Head tilt; effect only when hint opens in game","delay":0},{"line":"We did it! Our first little creation.","voice":"05_first_creation_complete.wav","effect":"One man clapping","url":"https://mixkit.co/free-sound-effects/applause/","action":"Clap or bounce","delay":1.2}];let active=[],timers=[],files={};const status=document.getElementById("status");function stop(){timers.forEach(clearTimeout);timers=[];active.forEach(a=>{a.pause();a.currentTime=0});active=[]}function playAudio(src,volume,delay){const a=new Audio(src);a.volume=volume;active.push(a);timers.push(setTimeout(()=>a.play().catch(e=>status.textContent="Playback failed: "+e.message),delay*1000));}rows.forEach((r,i)=>{const el=document.createElement("article");el.innerHTML=`<h2>${i+1}. ${r.line}</h2><small>Action: ${r.action}</small><p>Effect: <a href="${r.url}" target="_blank" rel="noopener">${r.effect}</a></p><small>Voice: ${r.voice||"Missing — choose your opening recording below"}</small><label>Voice file <input class="voice" type="file" accept="audio/*"></label><label>Effect file <input class="effect" type="file" accept="audio/*"></label><br><label>Voice starts at <input class="vd" type="number" min="0" step=".1" value="${r.voiceDelay||0}"> sec</label><label>Effect starts at <input class="ed" type="number" min="0" step=".1" value="${r.delay}"> sec</label><br><button class="solo">Voice only</button><button class="mixed">Voice + effect</button>`;document.getElementById("rows").append(el);for(const kind of ["voice","effect"]){el.querySelector("."+kind).onchange=e=>{const f=e.target.files[0];if(!f)return;const key=kind==="effect"&&i===4?"effect1":kind+i;if(files[key])URL.revokeObjectURL(files[key]);files[key]=URL.createObjectURL(f);status.textContent="Selected "+f.name;}}function run(mix){stop();const voice=files["voice"+i]||(r.voice?"audio/dialogue/lesson1/"+r.voice:null);if(!voice){status.textContent="Opening voice missing. Choose its recording first.";return;}const effect=files["effect"+(i===4?1:i)];status.textContent=mix&&!effect?"Playing voice only; choose the matching effect file to audition the mix.":"Playing line "+(i+1);playAudio(voice,1,mix?Math.max(0,+el.querySelector(".vd").value):0);if(mix&&effect)playAudio(effect,+document.getElementById("volume").value,Math.max(0,+el.querySelector(".ed").value));}el.querySelector(".solo").onclick=()=>run(false);el.querySelector(".mixed").onclick=()=>run(true);});document.getElementById("stop").onclick=stop;window.addEventListener("pagehide",stop);</script></html>
